name: quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-domain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install optional forecast bridge data frame support
        run: python -m pip install -e '.[kronos-bridge]'
      - name: Deterministic domain regression
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Whitespace
        run: git diff --check

  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install deterministic TesterArmy e2e dependencies
        run: npm ci --no-audit --no-fund
      - name: Install headless Chromium
        run: npx playwright install --with-deps chromium
      - name: End-to-end browser regression
        env:
          E2E_TELEMETRY_DISABLED: "1"
          PYTHONPATH: src
        run: npm run test:e2e -- --workers 1
